<html>
<head>
    <title>ADD NAMES</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        .image-container {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
        }
        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
        }
        .form-container {
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            color: white;
            width: 300px;
            background: rgba(0, 0, 0, 0.7);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }
        .form-container h2 {
            margin-bottom: 20px;
            font-size: 1.5em;
            font-weight: bold;
        }
        .form-container input {
            margin: 10px 0;
            padding: 10px;
            font-size: 1em;
            width: 80%;
            border: none;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .form-container button {
            margin: 10px 0;
            padding: 10px;
            font-size: 1em;
            width: 50%;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #28a745;
            color: white;
            transition: background-color 0.3s ease;
        }
        .form-container button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
 
 <div class="image-container">
        
	<img src="/HUNGERGAME/forestimage/img2.jpeg">
    <div class="overlay">
    <div class="form-container">
    
	<h2>ENTER PLAYER NAME</h2>
        
		<form action="addplayer.jsp" method="post">
        <input type="text" name="playerName" placeholder="playerName" required>
        <button type="submit" class="confirm-button">SUBMIT</button>
        
		</form>
    </div>
    </div>
  </div>
</body>
</html>
