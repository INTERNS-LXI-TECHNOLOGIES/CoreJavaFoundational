
<html>
<head>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f9;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  .container {
    text-align: center;
    background: #fff;
    padding: 40px 60px;
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
  }
  h1 {
    font-size: 3em;
    color: #333;
    margin-bottom: 20px;
  }
  .form-group {
    margin-bottom: 20px;
  }
  input[type="text"] {
    font-size: 1.2em;
    padding: 10px;
    width: 100%;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 5px;
  }
  input[type="submit"] {
    font-size: 1.5em;
    padding: 10px 20px;
    cursor: pointer;
    background-color: #4CAF50;
    color: white;
    border: none;
    border-radius: 5px;
    transition: background-color 0.3s;
  }
  input[type="submit"]:hover {
    background-color: #45a049;
  }
  input[type="text"]::placeholder {
    color: #999;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Hunger Game</h1>
  <form action="player.jsp">
    <div class="form-group">
      <input type="text" name="playersno" placeholder="Number of Players:" required>
    </div>
    <input type="submit" value="Submit">
  </form>
</div>
</body>
</html>
