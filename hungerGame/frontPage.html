<!DOCTYPE html>
<html>
<head>
    <title>HUNGER GAME</title>
	<meta http-equiv="refresh" content="5">
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background-color: #f0f0f0;
        }
        .image-container {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
        }
        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .text-overlay {
            position: absolute;
            width: 100%;
            color: white;
            font-weight: bold;
            text-shadow: 4px 4px 6px rgba(0, 0, 0, 0.5);
        }
        .title-1 {
            top: 40%;
            font-size: 4em;
        }
        .subtitle {
            top: 50.5%;
            font-size: 1.5em;
        }
        .button-container {
            position: absolute;
            top: 65%;
            width: 100%;
            display: flex;
            justify-content: center;
        }
        .start-button {
            padding: 10px 20px;
            font-size: 1.5em;
            font-weight: bold;
            color: white;
            background-color: #ff4500;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-shadow: none;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.3);
        }
        .start-button:hover {
            background-color: #ff6347;
        }
    </style>
    <script>
        async function checkGameStarted(){
			try {
				const response = await fetch('/hungerGame/checkGameStarted.jsp');
				const data = await response.json();

					if (data.gameStarted) {
						window.location.href = '/hungerGame/addContestants.jsp';
					}
					else {
						alert('The admin has not started the game yet.');
					}
			}
			catch {
				alert('"ERROR" Please try again later.');
			}
		}
    </script>
</head>
<body>
    <div class="image-container">
        <img src="/hungerGame/HungerGame-img/frontPageEntry.jpg" alt="Hunger Game">
        <div class="text-overlay title-1">HUNGER GAME</div>
        <div class="text-overlay subtitle">"In the shadows of the ancient forest, the hunter hunts down the players"</div>
        <div class="button-container">
            <button class="start-button" onclick="checkGameStarted()">ENTER GAME</button>
        </div>
    </div>
</body>
</html>
