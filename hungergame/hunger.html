<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hunger Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url('https://source.unsplash.com/1600x900/?dystopian,forest') no-repeat center center fixed;
            background-size: cover;
        }
        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        h1 {
            color: #ffd700;
            font-size: 4em;
            margin: 0;
            text-shadow: 2px 2px 4px #000000;
        }
        .play-button {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 30px;
            font-size: 1.5em;
            color: #fff;
            background-color: #ff4500;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }
        .play-button:hover {
            background-color: #ff6347;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>HUNGER GAME</h1>
        <a href="addplayer.jsp" class="play-button">PLAY</a>
    </div>
</body>
</html>
