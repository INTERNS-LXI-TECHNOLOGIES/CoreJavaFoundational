<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hunger Game Online</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f0f0f0;
        margin: 0;
        padding: 0;
        color: #333;
      }
      header {
        background: linear-gradient(to right, #ff7e5f, #feb47b);
        padding: 20px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      }
      .nav-bar {
        display: flex;
        justify-content: space-around;
        align-items: center;
        flex-wrap: wrap;
      }
      .nav-link {
        text-decoration: none;
        color: #fff;
        padding: 10px 20px;
        font-weight: bold;
        transition: background-color 0.3s ease, transform 0.3s ease;
      }
      .nav-link:hover {
        background-color: #ff4500;
        border-radius: 5px;
        transform: scale(1.1);
      }
      .content {
        background-color: #fff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        margin: 20px auto;
        max-width: 800px;
        overflow: hidden;
        position: relative;
      }
      .content::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: linear-gradient(
          45deg,
          #ffa500,
          #ff6347,
          #ff4500,
          #ff7e5f
        );
        opacity: 0.4;
        pointer-events: none;
      }
      iframe {
        max-width: 100%;
        height: auto;
        border: none;
        border-radius: 10px;
        position: relative;
        z-index: 1;
      }
      footer {
        background-color: #333;
        color: #fff;
        text-align: center;
        padding: 10px 0;
        position: fixed;
        bottom: 0;
        width: 100%;
      }
      @media (max-width: 768px) {
        .nav-bar {
          flex-direction: column;
        }
        .nav-link {
          padding: 10px 0;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <nav class="nav-bar">
        <a class="nav-link" href="#">Home</a>
        <a class="nav-link" href="#">Media</a>
        <a class="nav-link" href="#">Reviews</a>
        <a class="nav-link" href="#">Download</a>
        <a class="nav-link" href="#">Contact</a>
        <a class="nav-link" href="addPlayer.html">Play Now</a>
      </nav>
    </header>
    <div class="content">
      <iframe
        width="560"
        height="315"
        src="https://www.youtube.com/embed/VIDEO_ID"
        title="YouTube video title"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen
      ></iframe>
    </div>
    <footer>
      <p>&copy; 2024 Hunger Game Online. All rights reserved.</p>
    </footer>
  </body>
</html>
